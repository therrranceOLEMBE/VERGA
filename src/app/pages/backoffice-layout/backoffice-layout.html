<div class="backoffice-shell min-h-screen bg-verga-surface font-sans">
 @if (sidebarOpen() && !loggingOut()) {
 <button
 type="button"
 class="backoffice-overlay fixed inset-0 z-30 bg-black/40 lg:hidden"
 (click)="closeSidebar()"
 [attr.aria-label]="'aria.close' | translate"
 ></button>
 }

 <app-backoffice-sidebar
 [open]="sidebarOpen()"
 [loggingOut]="loggingOut()"
 (navigate)="closeSidebar()"
 (logoutRequest)="onLogoutRequest()"
 />

 <div class="backoffice-main flex min-h-screen min-h-dvh flex-col">
 <header class="backoffice-mobile-bar sticky top-0 z-20 flex items-center gap-3 border-b border-verga-border bg-white/95 px-4 py-3 backdrop-blur-sm lg:hidden">
 <button
 type="button"
 class="flex h-10 w-10 shrink-0 items-center justify-center border border-verga-border text-verga-primary transition hover:bg-verga-primary-muted"
 (click)="toggleSidebar()"
 [attr.aria-label]="'aria.openMenu' | translate"
 [attr.aria-expanded]="sidebarOpen()"
 >
 <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-5 w-5">
 <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
 </svg>
 </button>
 <a routerLink="/backoffice/tableau-de-bord" class="backoffice-mobile-bar__brand inline-flex min-w-0 flex-1 items-center">
 @if (agencyProfile().logoUrl) {
 <img
 [src]="agencyProfile().logoUrl"
 [alt]="agencyProfile().companyName || ('common.logoAlt' | translate)"
 class="backoffice-mobile-bar__logo"
 width="120"
 height="36"
 />
 } @else {
 <img
 src="/images/logo_verga.jpeg"
 [attr.alt]="'common.logoAlt' | translate"
 class="backoffice-mobile-bar__logo"
 width="120"
 height="36"
 />
 }
 </a>
 </header>

 <main class="min-h-0 flex-1 overflow-x-hidden overflow-y-auto p-4 sm:p-6 lg:p-8">
 <router-outlet />
 </main>
 </div>

 @if (loggingOut()) {
 <div class="agency-logout" role="status" aria-live="polite" aria-busy="true">
 <div class="agency-logout__orbit" aria-hidden="true"></div>
 <div class="agency-logout__copy">
 <p class="agency-logout__brand">VERGA</p>
 <h2>{{ 'backoffice.logoutFarewell.title' | translate }}</h2>
 <p>{{ 'backoffice.logoutFarewell.message' | translate }}</p>
 </div>
 </div>
 }
</div>
