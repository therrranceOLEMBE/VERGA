<div class="client-backoffice-shell min-h-screen font-sans">
  @if (sidebarOpen() && !loggingOut()) {
    <button
      type="button"
      class="client-backoffice-overlay fixed inset-0 z-30 bg-black/40 lg:hidden"
      (click)="closeSidebar()"
      [attr.aria-label]="'aria.close' | translate"
    ></button>
  }

  <app-client-backoffice-sidebar
    [open]="sidebarOpen()"
    [loggingOut]="loggingOut()"
    (navigate)="closeSidebar()"
    (logoutRequest)="onLogoutRequest()"
  />

  <div class="client-backoffice-main flex min-h-screen min-h-dvh flex-col">
    <header class="client-backoffice-mobile-bar sticky top-0 z-20 flex items-center gap-3 border-b border-verga-border px-4 py-3 lg:hidden">
      <button
        type="button"
        class="client-mobile-menu-btn"
        (click)="toggleSidebar()"
        [attr.aria-label]="'aria.openMenu' | translate"
        [attr.aria-expanded]="sidebarOpen()"
        [disabled]="loggingOut()"
      >
        ≡
      </button>
      <a routerLink="/accueil" class="client-mobile-brand inline-flex min-w-0 flex-1 items-baseline leading-none">
        <span class="client-mobile-brand__name">VERGA</span>
      </a>
    </header>

    <main class="min-h-0 flex-1 overflow-x-hidden overflow-y-auto p-4 sm:p-6 lg:p-8">
      <router-outlet />
    </main>
  </div>

  @if (loggingOut()) {
    <div class="client-logout-farewell" role="status" aria-live="polite" aria-busy="true">
      <div class="client-logout-farewell__glow" aria-hidden="true"></div>
      <div class="client-logout-farewell__card">
        <p class="client-logout-farewell__brand">VERGA</p>
        <p class="client-logout-farewell__eyebrow">{{ 'clientBackoffice.space' | translate }}</p>
        <h2 class="client-logout-farewell__title">{{ 'clientBackoffice.logoutFarewell.title' | translate }}</h2>
        <p class="client-logout-farewell__message">{{ 'clientBackoffice.logoutFarewell.message' | translate }}</p>
        <div class="client-logout-farewell__loader" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </div>
  }
</div>
