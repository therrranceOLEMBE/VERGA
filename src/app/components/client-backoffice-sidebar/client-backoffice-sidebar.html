<aside
 class="client-backoffice-sidebar fixed inset-y-0 left-0 z-40 flex h-screen min-h-full w-64 flex-col border-r border-verga-border bg-white font-sans lg:w-72"
 [class.is-open]="open()"
 (click)="$event.stopPropagation()"
>
 <div class="border-b border-verga-border px-5 py-6">
 <a routerLink="/accueil" class="inline-flex items-baseline leading-none">
 <span class="text-2xl font-bold tracking-tight text-verga-primary">VERGA</span>
 <span class="ml-0.5 text-xs font-semibold text-verga-primary-light">.com</span>
 </a>
 <p class="mt-2 text-xs font-medium uppercase tracking-wide text-verga-muted">{{ 'clientBackoffice.space' | translate }}</p>
 </div>

 <nav class="min-h-0 flex-1 overflow-y-auto py-4" [attr.aria-label]="'clientBackoffice.nav.label' | translate">
 <ul class="space-y-1">
 @for (item of navItems; track item.path) {
 <li>
 <a
 [routerLink]="item.path"
 routerLinkActive="!border-l-verga-primary !bg-verga-primary-muted !text-verga-primary"
 class="flex items-center gap-3 border-l-4 border-transparent px-4 py-3 text-sm font-medium text-verga-ink transition hover:bg-verga-primary-muted/60 hover:text-verga-primary"
 (click)="onNavigate()"
 >
 @switch (item.icon) {
 @case ('dashboard') {
 <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-5 w-5 shrink-0">
 <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 0 1 6 3.75h2.25A2.25 2.25 0 0 1 10.5 6v2.25a2.25 2.25 0 0 1-2.25 2.25H6a2.25 2.25 0 0 1-2.25-2.25V6ZM3.75 15.75A2.25 2.25 0 0 1 6 13.5h2.25a2.25 2.25 0 0 1 2.25 2.25V18a2.25 2.25 0 0 1-2.25 2.25H6A2.25 2.25 0 0 1 3.75 18v-2.25ZM13.5 6a2.25 2.25 0 0 1 2.25-2.25H18A2.25 2.25 0 0 1 20.25 6v2.25A2.25 2.25 0 0 1 18 10.5h-2.25a2.25 2.25 0 0 1-2.25-2.25V6ZM13.5 15.75a2.25 2.25 0 0 1 2.25-2.25H18a2.25 2.25 0 0 1 2.25 2.25V18A2.25 2.25 0 0 1 18 20.25h-2.25A2.25 2.25 0 0 1 13.5 18v-2.25Z" />
 </svg>
 }
 @case ('transactions') {
 <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-5 w-5 shrink-0">
 <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 18.75a60.07 60.07 0 0 1 15.797 2.101c.727.198 1.453-.342 1.453-1.096V18.75M3.75 4.5v.75A.75.75 0 0 1 3 6h-.75m0 0v-.375c0-.621.504-1.125 1.125-1.125H20.25c.621 0 1.125.504 1.125 1.125V6h-.75m0 0v-.375A.75.75 0 0 0 20.25 4.5h-15M3.75 6v12.75A2.25 2.25 0 0 0 6 21h12a2.25 2.25 0 0 0 2.25-2.25V6" />
 </svg>
 }
 @case ('profile') {
 <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-5 w-5 shrink-0">
 <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
 </svg>
 }
 }
 <span>{{ item.labelKey | translate }}</span>
 </a>
 </li>
 }
 </ul>
 </nav>

 <div class="mt-auto shrink-0 border-t border-verga-border p-4">
 <a
 routerLink="/connexion"
 class="flex w-full items-center justify-center gap-2 border border-verga-border bg-white px-4 py-3 text-sm font-semibold text-verga-ink transition hover:border-verga-primary hover:bg-verga-primary-muted hover:text-verga-primary"
 (click)="onNavigate()"
 >
 <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-5 w-5">
 <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m3 0 3-3m0 0-3-3m3 3H9" />
 </svg>
 {{ 'clientBackoffice.logout' | translate }}
 </a>
 </div>
</aside>
