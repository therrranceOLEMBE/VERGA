<aside
  class="client-backoffice-sidebar fixed inset-y-0 left-0 z-40 flex h-screen min-h-full w-64 flex-col border-r border-verga-border bg-white lg:w-72"
  [class.is-open]="open()"
  (click)="$event.stopPropagation()"
>
  <div class="client-sidebar-brand border-b border-verga-border px-5 py-6">
    <a routerLink="/accueil" class="inline-flex items-baseline leading-none">
      <span class="client-sidebar-brand__name">VERGA</span>
    </a>
    <p class="client-sidebar-brand__space">{{ 'clientBackoffice.space' | translate }}</p>
  </div>

  <nav class="min-h-0 flex-1 overflow-y-auto py-4" [attr.aria-label]="'clientBackoffice.nav.label' | translate">
    <ul class="client-nav-list">
      @for (item of navItems; track item.path; let i = $index) {
        <li>
          <a
            [routerLink]="item.path"
            routerLinkActive="client-nav-active"
            class="client-nav-link"
            (click)="onNavigate()"
          >
            <span class="client-nav-index" aria-hidden="true">{{ i + 1 < 10 ? '0' + (i + 1) : i + 1 }}</span>
            <span class="client-nav-label">{{ item.labelKey | translate }}</span>
          </a>
        </li>
      }
    </ul>
  </nav>

  <div class="client-sidebar-logout mt-auto shrink-0 border-t border-verga-border p-4">
    <button type="button" class="client-logout-btn" (click)="logout()">
      {{ 'clientBackoffice.logout' | translate }}
    </button>
  </div>
</aside>
