<div class="relative" data-lang-root>
  <button
    type="button"
    class="flex items-center gap-1 border border-verga-border bg-white px-2 py-1 text-xs text-verga-ink"
    [attr.aria-label]="'aria.language' | translate"
    [attr.aria-expanded]="open()"
    (click)="toggle($event)"
  >
    <span class="text-base leading-none">{{ currentFlag() }}</span>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="h-3 w-3 opacity-60">
      <path
        fill-rule="evenodd"
        d="M5.23 7.21a.75.75 0 0 1 1.06.02L10 11.168l3.71-3.94a.75.75 0 1 1 1.08 1.04l-4.25 4.5a.75.75 0 0 1-1.08 0l-4.25-4.5a.75.75 0 0 1 .02-1.06Z"
        clip-rule="evenodd"
      />
    </svg>
  </button>

  @if (open()) {
    <div
      class="absolute bottom-full right-0 z-50 mb-1 min-w-[140px] border border-verga-border bg-white py-1 shadow-lg"
      role="listbox"
    >
      @for (opt of options; track opt.code) {
        <button
          type="button"
          role="option"
          class="flex w-full items-center gap-2 px-3 py-2 text-left text-sm text-verga-ink hover:bg-verga-primary-muted"
          [class.bg-verga-primary-muted]="language.lang() === opt.code"
          (click)="select(opt.code, $event)"
        >
          <span class="text-base leading-none">{{ opt.flag }}</span>
          <span>{{ opt.labelKey | translate }}</span>
        </button>
      }
    </div>
  }
</div>
